[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoengine-01-naive-generation"
version = "0.1.0"
description = "Phase 1: Qwen3 in plain PyTorch, no KV cache, one request at a time"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "huggingface-hub>=0.25",
    "matplotlib>=3.9",
    "prometheus-client>=0.21",
    "pydantic-settings>=2.5",
    "safetensors>=0.4",
    "tokenizers>=0.20",
    "torch>=2.4",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "anyio>=4.4",
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "transformers>=4.51",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
extend = "../ruff.toml"
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --cov --cov-fail-under=80"

[tool.coverage.run]
source = ["nanoengine"]
omit = ["*/__main__.py"]
